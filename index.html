const streak=()=>{let n=0,d=new Date();if(!S.log[d.toISOString().slice(0,10)])d.setDate(d.getDate()-1);while(S.log[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}return n};
const fr=(a,b)=>`<span class=fr><i>${a}</i><b>${b}</b></span>`;
const quotes=["Kleine Schritte zählen – jeden Tag.","Du musst nicht perfekt sein, nur dranbleiben.","Heute ein Thema mehr als gestern.","Fehler sind Lernmaterial.","Du schaffst das, Schritt für Schritt."];
let tab="home",sess=null,calc=null;
const tabs=[["home","Home"],["learn","Lernen"],["calc","Rechnen"],["stat","Statistik"],["set","Einstellungen"]];
function nav(){$("#nav").innerHTML=tabs.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}
function bars(g,y,r,n){const t=g+y+r+n||1;return`<div class=bar><i class=g style=width:${g/t*100}%></i><i class=y style=width:${y/t*100}%></i><i class=r style=width:${r/t*100}%></i></div>`}
function home(){const g=cnt("g"),y=cnt("y"),r=cnt("r"),n=cnt("n"),t=Q.length,td=S.log[today()]||0;
let cd="Prüfungsdatum in den Einstellungen setzen";if(S.exam){const d=Math.ceil((new Date(S.exam)-new Date())/864e5);cd=d>=0?`<span class=big>${d}</span> Tage`:"Prüfung vorbei"}
const w={};Q.forEach(q=>{if("ry".includes(lv(q.id))&&lv(q.id)!="n")w[q.topic]=(w[q.topic]||0)+1});const top=Object.keys(w).sort((a,b)=>w[b]-w[a])[0];
return`<h1>Hey, ${S.name}!</h1><div class=card><div class=m>Countdown bis zur Abschlussprüfung</div>${cd}</div>
<div class=grid><div class=card><div class=m>Fortschritt</div><div class=big>${Math.round(g/t*100)} %</div></div><div class=card><div class=m>Streak</div><div class=big>${streak()} 🔥</div></div>
<div class=card><div class=m>Gelernt / offen</div><div class=big>${t-n} / ${n}</div></div><div class=card><div class=m>Lernzeit heute</div><div class=big>${Math.floor((S.secs[today()]||0)/60)} Min</div></div></div>
<div class=card><h3>Lernampel</h3>${bars(g,y,r,n)}<p class=m><span class="dot g"></span>${g} <span class="dot y"></span>${y} <span class="dot r"></span>${r} <span class="dot n"></span>${n}</p></div>
<div class=card><h3>Tagesziel: ${td} / ${S.goal} Fragen</h3><div class=bar><i class=g style=width:${Math.min(100,td/S.goal*100)}%></i></div><p class=m>Empfehlung: ${top?"Wiederhole heute „"+top+"“.":"Starte mit noch nicht gelernten Fragen."}</p><button onclick="tab='learn';render()">Weiterlernen</button></div>
<p class=m style="text-align:center">${quotes[new Date().getDate()%quotes.length]}</p>`}
function pool(f,A,D){const now=Date.now(),rk={r:0,y:1,n:2,g:3};let p=Q.filter(q=>(!A||q.examArea==A)&&(!D||q.difficulty==D)&&(f=="all"||f=="rand"||(f=="ry"?"ry".includes(lv(q.id)):lv(q.id)==f)));
if(f=="rand")return p.sort(()=>Math.random()-.5);return p.sort((a,b)=>((S.c[a.id]||{}).d>now)-((S.c[b.id]||{}).d>now)||rk[lv(a.id)]-rk[lv(b.id)])}
const e=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function back(q){let h="";if(q.formula)h+=`<p class=m>Formel: ${e(q.formula)}</p>`;h+=`<ul>${q.answer.map(a=>`<li>${e(a)}</li>`).join("")}</ul>`;if(q.explanation&&q.type!="true_false"&&q.type!="case")h+=`<p class=m>${e(q.explanation)}</p>`;return h}
function prep(){const q=sess.q[sess.i];sess.ord=shuf(q.type=="true_false"?[0,1]:q.options.map((_,i)=>i));sess.sel=[];sess.done=0}
function go(n){sess.i=Math.max(0,n);if(sess.i<sess.q.length)prep();render()}
function ok(q){const a=sess.sel.slice().sort().join(),b=q.correctOptionIndices.slice().sort().join();return a==b}
function pick(i){if(sess.done)return;const q=sess.q[sess.i];if(q.correctOptionIndices.length>1){const k=sess.sel.indexOf(i);k<0?sess.sel.push(i):sess.sel.splice(k,1);render()}else{sess.sel=[i];check()}}
function check(){const q=sess.q[sess.i];sess.done=1;S.hits=S.hits||{};const h=S.hits[q.id]||[0,0];h[ok(q)?0:1]++;S.hits[q.id]=h;save();render()}
function learn(){if(!sess)return`<h1>Lernen</h1><div class=card><label class=m>Auswahl</label><select id=f><option value=all>Alle Fragen (rote zuerst)<option value=r>Nur rote<option value=y>Nur gelbe<option value=ry>Rote und gelbe<option value=n>Noch nicht gelernte<option value=rand>Zufällig</select>
<label class=m>Bereich</label><select id=a><option value="">Alle<option value=KBP>KBP<option value=WISO>WiSo</select><label class=m>Schwierigkeit</label><select id=d><option value="">Alle<option value=easy>Leicht<option value=medium>Mittel<option value=hard>Schwer</select><label class=m>Anzahl</label><select id=k><option>5<option selected>10<option>20<option>30</select><button onclick="start()">Session starten</button></div>`;
if(sess.i>=sess.q.length)return`<h1>Geschafft! 🌸</h1><div class=card><p>${sess.q.length} Fragen bearbeitet.</p><button onclick="sess=null;render()">Zurück</button></div>`;
const q=sess.q[sess.i],multi=q.correctOptionIndices.length>1;
const ob=sess.ord.map(i=>{const c=q.correctOptionIndices.includes(i),s=sess.sel.includes(i);let st="";if(sess.done)st=c?"background:var(--sage)":s?"background:var(--red);color:#fff":"";else if(s)st="background:var(--rose)";return`<button class=s style="display:block;width:100%;text-align:left;margin:8px 0;${st}" onclick="pick(${i})">${e(q.options[i])}</button>`}).join("");
return`<div class=bar><i class=g style=width:${sess.i/sess.q.length*100}%></i></div><p class=m>${sess.i+1} / ${sess.q.length} · ${q.topic}${multi?" · mehrere Antworten richtig":""}</p>
<div class=card><b>${e(q.question)}</b>${ob}${!sess.done&&multi&&sess.sel.length?`<button onclick="check()">Antwort prüfen</button>`:""}
${sess.done?`<p><b>${ok(q)?"Richtig ✅":"Nicht ganz ❌"}</b></p>${back(q)}`:""}</div>
${sess.done?`<p class=m>Wie sicher warst du?</p><div class=row><button style=background:var(--red) onclick="rate('r')">Kann ich nicht</button><button style=background:var(--yel) onclick="rate('y')">Unsicher</button><button style=background:var(--sage) onclick="rate('g')">Sicher</button></div>`:""}
<div class=row style=margin-top:10px><button class=s onclick="go(sess.i-1)">Zurück</button><button class=s onclick="go(sess.i+1)">Überspringen</button></div>`}
function start(){const p=pool($("#f").value,$("#a").value,$("#d").value).slice(0,+$("#k").value);if(!p.length){alert("Keine Fragen in dieser Auswahl.");return}sess={q:p,i:0};prep();render()}
function rate(l){const q=sess.q[sess.i];S.c[q.id]={l,d:Date.now()+IV[l]*864e5};S.log[today()]=(S.log[today()]||0)+1;S.last=q.topic;save();go(sess.i+1)}
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function gen(k){let t,s;
if(k=="z"){const K=ri(12,96)*100,p=ri(3,9),d=ri(2,12)*15,z=K*p*d/36000;t=`Ein Kunde schuldet ${Z(K)} €. Der Zinssatz beträgt ${p} % p. a. Wie hoch sind die Zinsen für ${d} Tage?`;
s=[`Kapital K = ${Z(K)} €, Zinssatz p = ${p} %, Tage t = ${d}`,"Zinsen Z in €",`Z = ${fr("K · p · t","100 · 360")} (K Kapital, p Zinssatz, t Tage)`,`Z = ${fr(Z(K)+" · "+p+" · "+d,"100 · 360")}`,`Zähler: ${Z(K*p*d)} · Nenner: 36.000`,`<b>Z = ${Z(z)} €</b>`]}
else if(k=="s"){const R=ri(5,50)*100+ri(0,9)*10,p=[2,3][ri(0,1)],a=R*p/100;t=`Eine Rechnung über ${Z(R)} € (brutto) wird mit ${p} % Skonto bezahlt. Wie viel überweist du?`;
s=[`Rechnungsbetrag = ${Z(R)} €, Skonto = ${p} %`,"Überweisungsbetrag",`Skontobetrag = ${fr("Rechnung · Skonto %","100")}`,`${fr(Z(R)+" · "+p,"100")} = ${Z(a)} €`,`${Z(R)} € – ${Z(a)} €`,`<b>Überweisung = ${Z(R-a)} €</b>`]}
else{const N=ri(10,90)*10+ri(0,9),u=N*.19;t=`Nettobetrag ${Z(N)} €, Umsatzsteuer 19 %. Wie hoch ist der Bruttobetrag?`;
s=[`Netto = ${Z(N)} €, USt-Satz = 19 %`,"Umsatzsteuer und Brutto","Brutto = Netto · 1,19 (USt = Netto · 0,19)",`USt = ${Z(N)} · 0,19`,`USt = ${Z(u)} €; ${Z(N)} + ${Z(u)}`,`<b>Brutto = ${Z(N+u)} €</b>`]}
return{t,s}}
const L=["Gegeben","Gesucht","Formel","Zahlen einsetzen","Ausrechnen","Ergebnis"];
function calcv(){return`<h1>Rechentrainer</h1><div class=row><button onclick="calc=gen('z');render()">Zinsen</button><button onclick="calc=gen('s');render()">Skonto</button><button onclick="calc=gen('b');render()">Brutto</button></div>`+(calc?`<div class=card style=margin-top:14px><b>${calc.t}</b><p class=m>Rechne selbst und decke dann Schritt für Schritt auf.</p><div id=st></div><button class=s onclick="step()">Nächster Schritt</button></div>`:"")}
function step(){const e=$("#st");const n=e.children.length;if(n<6)e.insertAdjacentHTML("beforeend",`<p><span class=m>${n+1}. ${L[n]}:</span><br>${calc.s[n]}</p>`)}
function stat(){const th={};Q.forEach(q=>{const k=q.examArea+" · "+q.topic;(th[k]=th[k]||[]).push(q.id)});const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10)});
let R=0,W=0;Object.values(S.hits||{}).forEach(h=>{R+=h[0];W+=h[1]});return`<h1>Statistik</h1><div class=card><h3>Richtig / falsch</h3><p>${R} richtig · ${W} falsch${R+W?" · Erfolgsquote "+Math.round(R/(R+W)*100)+" %":""}</p></div><div class=card><h3>Nach Thema</h3>${Object.keys(th).map(k=>{const a=th[k],c=l=>a.filter(i=>lv(i)==l).length;return`<p class=m>${k}${bars(c("g"),c("y"),c("r"),c("n"))}</p>`}).join("")}</div>
<div class=card><h3>Letzte 7 Tage (Fragen / Min)</h3>${days.map(d=>`<p class=m>${d.slice(5)} · ${S.log[d]||0} Fragen · ${Math.floor((S.secs[d]||0)/60)} Min</p>`).join("")}</div>`}
function setv(){return`<h1>Einstellungen</h1><div class=card><label class=m>Prüfungsdatum</label><input type=date value="${S.exam}" onchange="S.exam=this.value;save()"><label class=m>Tagesziel (Fragen)</label><input type=number min=1 value=${S.goal} onchange="S.goal=+this.value||10;save()"></div>
<div class=card><h3>Sicherung</h3><p class=m>Kopiere den Text als Sicherung oder füge Text vom anderen Gerät ein.</p><textarea id=ex rows=5>${JSON.stringify(S)}</textarea><div class=row><button onclick="$('#ex').select();document.execCommand('copy')">Kopieren</button><button class=s onclick="imp()">Importieren</button></div></div>`}
function imp(){try{const x=JSON.parse($("#ex").value);if(!x.c)throw 0;S=Object.assign(S,x);save();alert("Importiert.");render()}catch(e){alert("Das ist keine gültige Sicherung.")}}
function render(){nav();$("#app").innerHTML={home,learn,calc:calcv,stat,set:setv}[tab]();window.scrollTo(0,0)}
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js")}catch(e){}
render();
</script></body></html>
